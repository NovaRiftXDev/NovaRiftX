# Free web hosting. Requires a separate free Neon Postgres database.
services:
  - type: web
    name: novariftx
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NOVA_REQUIRE_DB
        value: "true"
      - key: DATABASE_URL
        sync: false
